name: Harbor Health
description: Harbor Health is a Central Texas healthcare company building a vertically integrated
  "pay-vider" model that combines primary care, specialty care, and health coaching clinics with its
  own commercial and individual health insurance plans, so the same organization both delivers and
  covers care. Founded in 2022 by Dr. Clay Johnston (founding dean of UT Dell Medical School), Tony
  Miller, and Eric Scott, the company operates clinics and Express Care walk-in locations across the
  Austin, Dallas, El Paso, and San Antonio metros, and is pursuing a value-based care model for the
  commercial market. It is backed by General Catalyst, 8VC, and Alta Partners. Harbor Health publishes
  no public developer API; this API Evangelist profile tracks its public web properties (member portal,
  plans, blog, privacy and terms) for discovery and monitoring.
